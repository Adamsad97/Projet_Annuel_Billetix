# Surcharges pour le développement local
# Chargé par défaut via COMPOSE_FILE (.env). Ports des bases exposés sur
# l'hôte. Hot reload des services : voir docker-compose.hotreload.yml.

services:

  # Infrastructure : ports exposés pour accès direct depuis l'hôte
  auth-db:
    ports:
      - "5432:5432"
  user-db:
    ports:
      - "5433:5432"
  event-db:
    ports:
      - "5434:5432"
  order-db:
    ports:
      - "5435:5432"
  ticket-db:
    ports:
      - "5436:5432"
  payment-db:
    ports:
      - "5437:5432"
  admin-db:
    ports:
      - "5438:5432"
  redis:
    ports:
      - "6379:6379"
  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"
  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
  mailpit:
    ports:
      - "1025:1025"
      - "8025:8025"

