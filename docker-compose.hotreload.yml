# Hot reload facultatif (lent sous Windows) : docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.hotreload.yml up -d

services:

  # Services métier : hot reload activé via volume mount
  api-gateway:
    build:
      target: development
    volumes:
      - ./backend/api-gateway:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev

  auth-service:
    build:
      target: development
    volumes:
      - ./backend/auth-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  user-service:
    build:
      target: development
    volumes:
      - ./backend/user-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  event-service:
    build:
      target: development
    volumes:
      - ./backend/event-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  order-service:
    build:
      target: development
    volumes:
      - ./backend/order-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  ticket-service:
    build:
      target: development
    volumes:
      - ./backend/ticket-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  payment-service:
    build:
      target: development
    volumes:
      - ./backend/payment-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  notification-service:
    build:
      target: development
    volumes:
      - ./backend/notification-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  realtime-service:
    build:
      target: development
    volumes:
      - ./backend/realtime-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  pdf-service:
    build:
      target: development
    volumes:
      - ./backend/pdf-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  admin-service:
    build:
      target: development
    volumes:
      - ./backend/admin-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    # Turbopack ignore WATCHPACK_POLLING et son HMR via bind mount Windows est très lent : redémarrer le frontend après un changement.
    command: npm run dev
    ports:
      - "3000:3000"
  
