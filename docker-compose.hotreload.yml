# Hot reload (code monté depuis l'hôte + nest start --watch / next dev).
# NON chargé par défaut : sous Windows, 11 compilations TypeScript en watch
# sur des bind mounts rendaient chaque démarrage extrêmement lent.
# Usage ponctuel :
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.hotreload.yml up -d

services:

  # Services métier : hot reload activé via volume mount
  api-gateway:
    build:
      target: development
    volumes:
      - ./backend/api-gateway:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev

  auth-service:
    build:
      target: development
    volumes:
      - ./backend/auth-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  user-service:
    build:
      target: development
    volumes:
      - ./backend/user-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  event-service:
    build:
      target: development
    volumes:
      - ./backend/event-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  order-service:
    build:
      target: development
    volumes:
      - ./backend/order-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  ticket-service:
    build:
      target: development
    volumes:
      - ./backend/ticket-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  payment-service:
    build:
      target: development
    volumes:
      - ./backend/payment-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  notification-service:
    build:
      target: development
    volumes:
      - ./backend/notification-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  pdf-service:
    build:
      target: development
    volumes:
      - ./backend/pdf-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  admin-service:
    build:
      target: development
    volumes:
      - ./backend/admin-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run start:dev
  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    # Bug corrigé : WATCHPACK_POLLING (webpack) retiré — ce projet tourne sur
    # une version de Next.js où Turbopack est le bundler par défaut en dev,
    # WATCHPACK_POLLING n'a donc aucun effet dessus. La doc Next.js elle-même
    # prévient que le HMR Turbopack via un bind mount Windows/Mac peut
    # prendre "des secondes, voire des minutes" — en pratique quasi jamais
    # côté Windows. Pas de solution fiable en conteneur : redémarrer le
    # service frontend après chaque changement de fichier plutôt que
    # compter sur le hot-reload (cf. node_modules/next/dist/docs/01-app/
    # 02-guides/local-development.md, point 8).
    command: npm run dev
    ports:
      - "3000:3000"
  
