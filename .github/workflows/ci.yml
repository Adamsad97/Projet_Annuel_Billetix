name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'scripts/ci-e2e-env.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'scripts/ci-e2e-env.sh'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - api-gateway
          - auth-service
          - event-service
          - notification-service
          - realtime-service
          - order-service
          - payment-service
          - pdf-service
          - ticket-service
          - user-service

    defaults:
      run:
        working-directory: backend/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --ci

  functional-tests:
    name: tests fonctionnels (pile complète)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_API_URL: http://localhost:4000/api/v1
      E2E_MAILPIT_URL: http://localhost:8025
      E2E_ADMIN_EMAIL: admin.e2e@billetix.local
      E2E_ADMIN_PASSWORD: E2e-Admin-Ci-${{ github.run_id }}!
      E2E_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/api-gateway/package-lock.json

      - name: Préparer l'environnement (secrets propres à l'exécution, emails vers Mailpit)
        run: bash scripts/ci-e2e-env.sh

      - name: Démarrer la pile backend
        run: >-
          docker compose up -d --build --wait --wait-timeout 900
          api-gateway auth-service user-service event-service order-service ticket-service
          payment-service notification-service realtime-service pdf-service admin-service mailpit

      - name: Installer les dépendances des tests
        working-directory: backend/api-gateway
        run: npm ci --legacy-peer-deps

      - name: Tests fonctionnels
        working-directory: backend/api-gateway
        run: npm run test:e2e -- --ci

      - name: Journaux des services en cas d'échec
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Arrêter la pile
        if: always()
        run: docker compose down -v

  publish:
    name: publish ${{ matrix.service }}
    needs: [build-and-test, functional-tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - api-gateway
          - auth-service
          - event-service
          - notification-service
          - realtime-service
          - order-service
          - payment-service
          - pdf-service
          - ticket-service
          - user-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase, requis par GHCR)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.service }}
          target: production
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
