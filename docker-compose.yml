networks:
  billetix-net:
    driver: bridge

volumes:
  auth_db_data:
  users_db_data:
  events_db_data:
  orders_db_data:
  tickets_db_data:
  payments_db_data:
  admin_db_data:
  redis_data:
  rabbitmq_data:
  minio_data:

services:

  # ──────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE — une base PostgreSQL dédiée par service
  # ──────────────────────────────────────────────────────────────────

  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auth
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - ./backend/infra/postgres/auth-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - billetix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: users
    volumes:
      - users_db_data:/var/lib/postgresql/data
      - ./backend/infra/postgres/users-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - billetix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d users"]
      interval: 10s
      timeout: 5s
      retries: 5

  event-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: events
    volumes:
      - events_db_data:/var/lib/postgresql/data
      - ./backend/infra/postgres/events-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - billetix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d events"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orders
    volumes:
      - orders_db_data:/var/lib/postgresql/data
      - ./backend/infra/postgres/orders-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - billetix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d orders"]
      interval: 10s
      timeout: 5s
      retries: 5

  ticket-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tickets
    volumes:
      - tickets_db_data:/var/lib/postgresql/data
      - ./backend/infra/postgres/tickets-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - billetix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d tickets"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: payments
    volumes:
      - payments_db_data:/var/lib/postgresql/data
      - ./backend/infra/postgres/payments-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - billetix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d payments"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: admin_logs
    volumes:
      - admin_db_data:/var/lib/postgresql/data
      - ./backend/infra/postgres/admin-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - billetix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d admin_logs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - billetix-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - billetix-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Sans start_period, le 1er test n'arrive qu'après 30s — et tous les
      # microservices attendent RabbitMQ.
      start_period: 60s
      start_interval: 2s

  minio:
    # minio/minio n'est plus publié sur Docker Hub/Quay : build Chainguard
    # (même binaire). Tourne en uid 65532 par défaut, qui ne peut pas écrire
    # dans un volume neuf (créé root) → forcé en root.
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - billetix-net
    healthcheck:
      # Pas de curl dans l'image Chainguard, mais mc est fourni.
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Capture SMTP de dev (successeur maintenu de MailHog, abandonné depuis
  # 2020) : ~50 Mo contre ~570 Mo, mêmes ports 1025 (SMTP) / 8025 (UI).
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - billetix-net
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # ──────────────────────────────────────────────────────────────────
  # SERVICES MÉTIER
  # ──────────────────────────────────────────────────────────────────

  # NODE_ENV des microservices : "development" par défaut, car en
  # "production" TypeORM passe de synchronize à migrationsRun, et les
  # migrations sont en retard sur les entités (ex. non_profit_verified,
  # first_sale_notified absents) → schéma incomplet. Le code tourne quand
  # même compilé (target production, node dist/main), sans watch ni bind
  # mount. Passer BACKEND_NODE_ENV=production seulement une fois les
  # migrations rattrapées.
  api-gateway:
    build:
      context: ./backend/api-gateway
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 3002
      EVENT_SERVICE_HOST: event-service
      EVENT_SERVICE_PORT: 3003
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_PORT: 3004
      TICKET_SERVICE_HOST: ticket-service
      TICKET_SERVICE_PORT: 3005
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: 3006
      ADMIN_SERVICE_HOST: admin-service
      ADMIN_SERVICE_PORT: 3009
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      MINIO_ENDPOINT: minio
      # Hôte réellement joignable depuis le navigateur pour les URLs de
      # fichiers renvoyées au client (posters/avatars/documents/billets PDF)
      # — distinct de MINIO_ENDPOINT, interne au réseau Docker.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_POSTERS: ${MINIO_BUCKET_POSTERS:-posters}
      MINIO_BUCKET_AVATARS: ${MINIO_BUCKET_AVATARS:-avatars}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-documents}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/v1/auth/google/callback}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-http://localhost:4000/api/v1/auth/facebook/callback}
    ports:
      - "4000:4000"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      # Sondes rapprochées pendant le démarrage seulement : chaque service
      # attend la santé du précédent, 15s d'écart par étage sinon.
      start_interval: 2s
    networks:
      - billetix-net

  auth-service:
    build:
      context: ./backend/auth-service
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@auth-db:5432/auth
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      # Premier admin (ne crée jamais de doublon si un ADMIN existe déjà)
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_URL: ${APP_URL:-http://localhost:4000}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      # Appelé par TwoFactorService.disable() pour vérifier qu'aucun IBAN
      # organisateur n'est enregistré avant d'autoriser la désactivation
      # (CDC §2.3). Pas de depends_on ici : user-service dépend déjà de
      # auth-service (voir plus bas), un depends_on inverse créerait un cycle.
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 3002
      # Config plateforme (seuil/durée de verrouillage de compte) — voir
      # PlatformConfigCache. Pas de cycle : admin-service ne dépend de rien
      # côté auth.
      ADMIN_SERVICE_HOST: admin-service
      ADMIN_SERVICE_PORT: 3009
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      admin-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9001/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    networks:
      - billetix-net

  user-service:
    build:
      context: ./backend/user-service
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@user-db:5432/users
      IBAN_ENCRYPTION_KEY: ${IBAN_ENCRYPTION_KEY}
      MINIO_ENDPOINT: minio
      # Hôte réellement joignable depuis le navigateur pour les URLs de
      # fichiers renvoyées au client (posters/avatars/documents/billets PDF)
      # — distinct de MINIO_ENDPOINT, interne au réseau Docker.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_AVATARS: ${MINIO_BUCKET_AVATARS:-avatars}
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
    depends_on:
      user-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9002/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    networks:
      - billetix-net

  event-service:
    build:
      context: ./backend/event-service
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@event-db:5432/events
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      MINIO_ENDPOINT: minio
      # Hôte réellement joignable depuis le navigateur pour les URLs de
      # fichiers renvoyées au client (posters/avatars/documents/billets PDF)
      # — distinct de MINIO_ENDPOINT, interne au réseau Docker.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_POSTERS: ${MINIO_BUCKET_POSTERS:-posters}
      ADMIN_SERVICE_HOST: admin-service
      ADMIN_SERVICE_PORT: 3009
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
      # Pour lire les préférences de notification de l'organisateur avant
      # d'envoyer l'alerte de remplissage (TicketCategoryService).
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 3002
    depends_on:
      event-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9003/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    networks:
      - billetix-net

  order-service:
    build:
      context: ./backend/order-service
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@order-db:5432/orders
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      STOCK_RESERVATION_TTL_SECONDS: ${STOCK_RESERVATION_TTL_SECONDS:-600}
      EVENT_SERVICE_HOST: event-service
      EVENT_SERVICE_PORT: 3003
      TICKET_SERVICE_HOST: ticket-service
      TICKET_SERVICE_PORT: 3005
      ADMIN_SERVICE_HOST: admin-service
      ADMIN_SERVICE_PORT: 3009
      # Pour lire les préférences de notification de l'acheteur avant
      # d'envoyer le rappel J-1 (ReminderService).
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 3002
      # Pour résoudre l'email réel du compte avant d'envoyer les
      # recommandations hebdomadaires (RecommendationService) — jamais celui,
      # potentiellement fautif ou périmé, saisi sur une ancienne commande.
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
    depends_on:
      order-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      event-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9004/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    networks:
      - billetix-net

  ticket-service:
    build:
      context: ./backend/ticket-service
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 3005
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ticket-db:5432/tickets
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      OFFLINE_SYNC_MAX_HOURS: ${OFFLINE_SYNC_MAX_HOURS:-4}
      ADMIN_SERVICE_HOST: admin-service
      ADMIN_SERVICE_PORT: 3009
    depends_on:
      ticket-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      admin-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9005/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    networks:
      - billetix-net

  payment-service:
    build:
      context: ./backend/payment-service
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 3006
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@payment-db:5432/payments
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID}
      ORANGE_MONEY_CLIENT_ID: ${ORANGE_MONEY_CLIENT_ID}
      ORANGE_MONEY_CLIENT_SECRET: ${ORANGE_MONEY_CLIENT_SECRET}
      ORANGE_MONEY_MERCHANT_KEY: ${ORANGE_MONEY_MERCHANT_KEY}
      ORANGE_MONEY_API_BASE: ${ORANGE_MONEY_API_BASE:-https://api.orange.com}
      ORANGE_MONEY_COUNTRY: ${ORANGE_MONEY_COUNTRY:-sn}
      ORANGE_MONEY_CURRENCY: ${ORANGE_MONEY_CURRENCY:-OUV}
      WAVE_API_KEY: ${WAVE_API_KEY}
      WAVE_API_BASE: ${WAVE_API_BASE:-https://api.wave.com}
      WAVE_WEBHOOK_SECRET: ${WAVE_WEBHOOK_SECRET}
      WAVE_CURRENCY: ${WAVE_CURRENCY:-XOF}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_SERVICE_HOST: admin-service
      ADMIN_SERVICE_PORT: 3009
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 3002
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
      EVENT_SERVICE_HOST: event-service
      EVENT_SERVICE_PORT: 3003
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9006/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    networks:
      - billetix-net

  notification-service:
    build:
      context: ./backend/notification-service
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 3007
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@billetix.fr}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-BilletiX}
      # Liens cliqués par l'utilisateur dans ses emails -> le frontend
      # (3000), jamais l'api-gateway (4000, réservé aux callbacks OAuth
      # d'auth-service). Bug corrigé : APP_URL pointait vers le gateway,
      # tous les liens (vérification email, reset mdp...) renvoyaient 404.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Plus d'accès MinIO ici : la facture jointe est lue par l'api-gateway
      # (buckets billets/factures privés) et transmise dans le message.
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9007/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    networks:
      - billetix-net

  pdf-service:
    build:
      context: ./backend/pdf-service
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 3008
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      MINIO_ENDPOINT: minio
      # Hôte réellement joignable depuis le navigateur pour les URLs de
      # fichiers renvoyées au client (posters/avatars/documents/billets PDF)
      # — distinct de MINIO_ENDPOINT, interne au réseau Docker.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_TICKETS: ${MINIO_BUCKET_TICKETS:-tickets}
      MINIO_BUCKET_INVOICES: ${MINIO_BUCKET_INVOICES:-invoices}
      TICKET_SERVICE_HOST: ticket-service
      TICKET_SERVICE_PORT: 3005
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_PORT: 3004
      # Plafond de tentatives de génération PDF avant abandon + alerte admin
      # (platform_settings, cf. PlatformConfigCache) — admin-service ne
      # dépend de rien ici, aucun cycle.
      ADMIN_SERVICE_HOST: admin-service
      ADMIN_SERVICE_PORT: 3009
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9008/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    networks:
      - billetix-net

  admin-service:
    build:
      context: ./backend/admin-service
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 3009
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@admin-db:5432/admin_logs
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      admin-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9009/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    networks:
      - billetix-net

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      # Bug corrigé : les Server Components (accueil, catalogue, détail
      # événement, revente, création d'événement...) tournent dans le
      # conteneur frontend et appelaient NEXT_PUBLIC_API_URL
      # (localhost:4000) — injoignable depuis l'intérieur du conteneur,
      # "localhost" y désignant le conteneur frontend lui-même. Toutes ces
      # pages rendaient des listes vides sans erreur visible (fetch avalé
      # par un .catch(() => [])). API_INTERNAL_URL cible l'api-gateway par
      # son nom de service Docker, résolu par le DNS interne du réseau
      # billetix-net — jamais exposé au bundle navigateur (pas de préfixe
      # NEXT_PUBLIC_, donc invisible côté client, où il n'aurait de toute
      # façon aucun sens).
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api-gateway:4000/api/v1}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - billetix-net

